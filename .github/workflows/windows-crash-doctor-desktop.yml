name: Windows Crash Doctor Product Gate

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'windows-crash-doctor/**'
      - '.github/workflows/windows-crash-doctor-desktop.yml'
      - 'INSTALL-WINDOWS-CRASH-DOCTOR-GUI.cmd'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'windows-crash-doctor/**'
      - 'docs/**'
      - '.github/workflows/windows-crash-doctor-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-crash-doctor-product-gate
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify engine + desktop + release package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse every PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = New-Object System.Collections.Generic.List[string]
          Get-ChildItem '.\windows-crash-doctor', '.\scripts' -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              foreach ($parseError in @($parseErrors)) {
                $diagnostics.Add("$($_.FullName):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)")
              }
            }
          if ($diagnostics.Count -gt 0) {
            $diagnostics | ForEach-Object { Write-Host $_ }
            throw "PowerShell parser found $($diagnostics.Count) error(s)."
          }

      - name: Run PSScriptAnalyzer errors gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $issues = @()
          $issues += Invoke-ScriptAnalyzer -Path '.\windows-crash-doctor' -Recurse -Severity Error
          $issues += Invoke-ScriptAnalyzer -Path '.\scripts' -Recurse -Severity Error
          if ($issues.Count -gt 0) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($issues.Count) error-severity issue(s)."
          }

      - name: Run core snapshot regression tests
        shell: powershell
        run: |
          .\windows-crash-doctor\tests\self-test.ps1 -RepositoryMode
          .\windows-crash-doctor\tests\telemetry-self-test.ps1
          .\windows-crash-doctor\tests\integration-self-test.ps1 -RepositoryMode

      - name: Run Network Doctor classification self-test
        shell: powershell
        run: .\windows-crash-doctor\NetworkDoctor.ps1 -SelfTest

      - name: Run native dump regression tests
        shell: powershell
        run: |
          .\windows-crash-doctor\tests\dump-parser-test.ps1
          .\windows-crash-doctor\tests\dump-parser-real-smoke.ps1

      - name: Run Pester integration suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.5.0 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = '.\windows-crash-doctor\tests\Integrations.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }

      - name: Run public evidence safety guard
        shell: powershell
        run: .\scripts\check-public-evidence.ps1

      - name: Build self-contained desktop executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore .\desktop\WindowsCrashDoctor.App\WindowsCrashDoctor.App.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet publish .\desktop\WindowsCrashDoctor.App\WindowsCrashDoctor.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:SourceRevisionId=$env:GITHUB_SHA `
            -o .\dist\win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path .\dist\win-x64\WindowsCrashDoctor.exe -PathType Leaf)) {
            throw 'WindowsCrashDoctor.exe was not produced.'
          }

      - name: Run packaged EXE engine smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $errorPath = Join-Path $env:TEMP 'WindowsCrashDoctor-selftest-error.txt'
          $progressPath = Join-Path $env:TEMP 'WindowsCrashDoctor-selftest-progress.txt'
          Remove-Item -LiteralPath $errorPath, $progressPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath .\dist\win-x64\WindowsCrashDoctor.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(120000)) {
            Write-Host '--- WindowsCrashDoctor.exe self-test timeout ---'
            if (Test-Path -LiteralPath $progressPath -PathType Leaf) {
              Write-Host 'Last self-test stage:'
              Get-Content -LiteralPath $progressPath -Raw | Write-Host
            }
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw 'Packaged WindowsCrashDoctor.exe self-test exceeded the 120-second watchdog.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $progressPath -PathType Leaf) {
              Write-Host 'Last self-test stage:'
              Get-Content -LiteralPath $progressPath -Raw | Write-Host
            }
            if (Test-Path -LiteralPath $errorPath -PathType Leaf) {
              Write-Host '--- WindowsCrashDoctor.exe self-test diagnostic ---'
              Get-Content -LiteralPath $errorPath -Raw | Write-Host
              Write-Host '--- end self-test diagnostic ---'
            }
            throw "Packaged WindowsCrashDoctor.exe self-test failed with exit code $($process.ExitCode)."
          }
          if (Test-Path -LiteralPath $progressPath -PathType Leaf) {
            $finalStage = Get-Content -LiteralPath $progressPath -Raw
            if ($finalStage -notmatch '\bcomplete\s*$') { throw "Packaged self-test exited without the complete stage: $finalStage" }
          }

      - name: Build verified release bundle and manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = '.\dist\release'
          $engineStage = '.\dist\engine-stage'
          New-Item -ItemType Directory -Path $release, $engineStage -Force | Out-Null

          Copy-Item .\dist\win-x64\WindowsCrashDoctor.exe (Join-Path $release 'WindowsCrashDoctor.exe') -Force
          Copy-Item .\scripts\Install-WindowsCrashDoctorGui.ps1 (Join-Path $release 'Install-WindowsCrashDoctorGui.ps1') -Force
          Copy-Item .\scripts\Install-WindowsCrashDoctor.ps1 (Join-Path $release 'Install-WindowsCrashDoctor.ps1') -Force
          Copy-Item .\INSTALL-WINDOWS-CRASH-DOCTOR-GUI.cmd (Join-Path $release 'INSTALL-WINDOWS-CRASH-DOCTOR-GUI.cmd') -Force

          Copy-Item .\windows-crash-doctor -Destination $engineStage -Recurse -Force
          Copy-Item .\scripts -Destination $engineStage -Recurse -Force
          Compress-Archive -Path (Join-Path $engineStage '*') -DestinationPath (Join-Path $release 'WindowsCrashDoctor-Engine.zip') -CompressionLevel Optimal -Force

          $assets = @(
            'WindowsCrashDoctor.exe',
            'WindowsCrashDoctor-Engine.zip',
            'Install-WindowsCrashDoctorGui.ps1',
            'Install-WindowsCrashDoctor.ps1',
            'INSTALL-WINDOWS-CRASH-DOCTOR-GUI.cmd'
          )
          $assetRecords = @()
          foreach ($name in $assets) {
            $path = Join-Path $release $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
            $assetRecords += [ordered]@{
              name = $name
              sha256 = $hash
              sizeBytes = (Get-Item -LiteralPath $path).Length
            }
          }

          $version = Get-Content .\windows-crash-doctor\version.json -Raw | ConvertFrom-Json
          [ordered]@{
            schemaVersion = 1
            channel = 'canary'
            productVersion = [string]$version.productVersion
            engineVersion = [string]$version.engineVersion
            ruleSetVersion = [string]$version.ruleSetVersion
            sourceCommit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            generatedAtUtc = [datetimeoffset]::UtcNow.ToString('o')
            verification = [ordered]@{
              powershellParser = 'passed'
              psscriptAnalyzer = 'passed'
              snapshotTests = 'passed'
              telemetryTests = 'passed'
              dumpTests = 'passed'
              integrationTests = 'passed'
              publicEvidenceGuard = 'passed'
              packagedExeSelfTest = 'passed'
            }
            assets = $assetRecords
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $release 'release-manifest.json') -Encoding utf8

          Get-ChildItem $release | Sort-Object Name | Format-Table Name, Length

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCrashDoctor-verified-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  release-canary:
    name: Publish canary only after product gate
    if: github.ref == 'refs/heads/main'
    needs: verify-and-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download already-verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: WindowsCrashDoctor-verified-${{ github.sha }}
          path: release

      - name: Verify artifact hashes survived handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem .\release -File -Filter '*.sha256' | ForEach-Object {
            $checksum = Get-Content -LiteralPath $_.FullName -Raw
            $match = [regex]::Match($checksum, '(?i)\b([0-9a-f]{64})\b\s+(.+)$')
            if (-not $match.Success) { throw "Invalid checksum file: $($_.Name)" }
            $asset = Join-Path $_.DirectoryName $match.Groups[2].Value.Trim()
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Checksum target is missing: $asset" }
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $match.Groups[1].Value.ToLowerInvariant()) { throw "Artifact handoff checksum failed: $asset" }
          }

      - name: Publish rolling canary release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-crash-doctor-desktop-latest'
          $repo = $env:GITHUB_REPOSITORY

          Write-Host "Checking for existing release $tag in $repo..."
          $existingTags = @(& gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($existingTags -contains $tag) {
            Write-Host "Deleting existing release $tag..."
            & gh release delete $tag --yes --cleanup-tag
          }

          $matchingRefs = @(& gh api "repos/$repo/git/matching-refs/tags/$tag" --jq '.[].ref')
          if ($matchingRefs.Count -gt 0) {
            Write-Host "Cleaning up orphaned git tag $tag..."
            & gh api -X DELETE "repos/$repo/git/refs/tags/$tag"
          }

          $manifest = Get-Content .\release\release-manifest.json -Raw | ConvertFrom-Json
          $notes = @(
            '**Canary / advanced preview - not a stable release.**',
            '',
            'This artifact was published only after the repository product gate passed: PowerShell parsing, PSScriptAnalyzer, snapshot/telemetry/dump/integration regression tests, public-evidence guard, desktop compilation, packaged-engine extraction and an end-to-end `WindowsCrashDoctor.exe --self-test`.',
            '',
            "Source commit: $env:GITHUB_SHA",
            "Product: $($manifest.productVersion)",
            "Engine: $($manifest.engineVersion)",
            "Rule set: $($manifest.ruleSetVersion)",
            '',
            'Installers verify SHA-256 before executing/installing downloaded release assets. The executable is still unsigned, so Windows SmartScreen may show **Unknown Publisher**.'
          ) -join "`n"

          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.Encoding]::UTF8)

          $assets = @(Get-ChildItem .\release -File | Select-Object -ExpandProperty FullName)
          Write-Host "Publishing release $tag with $($assets.Count) assets..."
          & gh release create $tag $assets --target $env:GITHUB_SHA --title 'Windows Doctor Canary' --notes-file $notesFile --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
          Write-Host "Canary release published successfully." -ForegroundColor Green
